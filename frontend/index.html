<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word 模板智能提取转换</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .log-container {
            max-height: 200px;
            overflow-y: auto;
            font-family: monospace;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800">
    <!-- Navbar -->
    <nav class="bg-white shadow-md py-4">
        <div class="container mx-auto px-6 flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold text-blue-600">Word 模板快速转换器</h1>
                <p class="text-sm text-gray-500">一次性快速转换服务，随时可用，用完即弃，保障隐私</p>
            </div>
            <div class="flex items-center space-x-4">
                <a href="/frontend/compare.html" class="text-blue-500 hover:underline text-sm font-medium">✨ Word 对比工具</a>
                <a href="https://github.com/aliveriver/convert" target="_blank" class="text-gray-500 hover:text-gray-900 transition-colors" title="View Source on GitHub">
                    <svg class="h-6 w-6" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                        <path fill-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z" clip-rule="evenodd"></path>
                    </svg>
                </a>
            </div>
        </div>
    </nav>

    <main class="container mx-auto px-6 py-8 flex flex-col items-center">
        <!-- AI Alert -->
        <div class="w-full max-w-2xl mb-6 bg-yellow-50 border-l-4 border-yellow-500 p-4 rounded-r shadow-sm">
            <div class="flex">
                <div class="flex-shrink-0">
                    <svg class="h-5 w-5 text-yellow-500" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                        <path fill-rule="evenodd" d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.213 2.98-1.742 2.98H4.42c-1.53 0-2.493-1.646-1.743-2.98l5.58-9.92zM11 13a1 1 0 11-2 0 1 1 0 012 0zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z" clip-rule="evenodd" />
                    </svg>
                </div>
                <div class="ml-3">
                    <p class="text-sm text-yellow-700 font-medium">
                        <strong>⚠️ 注意：</strong> 转换结果基于 AI 大语言模型自动生成，可能会存在内容幻觉或格式编排错误。请务必在提交前进行人工核对！
                    </p>
                </div>
            </div>
        </div>

        <!-- Main Form Box -->
        <div class="bg-white rounded-xl shadow-lg w-full max-w-2xl p-8 mb-8">
            <h2 class="text-xl font-bold mb-6 text-gray-700 border-b pb-2">提交文档</h2>
            
            <form id="convert-form" class="space-y-6">
                <!-- Template upload -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">模板文件 (Template .docx)</label>
                    <div class="flex items-center justify-center w-full">
                        <label for="template" class="flex flex-col items-center justify-center w-full h-32 border-2 border-dashed rounded-lg cursor-pointer bg-gray-50 hover:bg-gray-100 hover:border-blue-400 border-gray-300">
                            <div class="flex flex-col items-center justify-center pt-5 pb-6">
                                <svg aria-hidden="true" class="w-8 h-8 mb-3 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
                                <p class="mb-2 text-sm text-gray-500"><span class="font-semibold">点击上传</span> 或拖拽文件</p>
                                <p class="text-xs text-gray-500 name-display" id="template-name">支持 .docx 格式，最大 10MB</p>
                            </div>
                            <input id="template" type="file" accept=".docx" class="hidden" required />
                        </label>
                    </div>
                </div>

                <!-- Content upload -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">内容文件 (Content .docx)</label>
                    <div class="flex items-center justify-center w-full">
                        <label for="content" class="flex flex-col items-center justify-center w-full h-32 border-2 border-dashed rounded-lg cursor-pointer bg-gray-50 hover:bg-gray-100 hover:border-blue-400 border-gray-300">
                            <div class="flex flex-col items-center justify-center pt-5 pb-6">
                                <svg aria-hidden="true" class="w-8 h-8 mb-3 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
                                <p class="mb-2 text-sm text-gray-500"><span class="font-semibold">点击上传</span> 或拖拽文件</p>
                                <p class="text-xs text-gray-500 name-display" id="content-name">支持 .docx 格式，最大 10MB</p>
                            </div>
                            <input id="content" type="file" accept=".docx" class="hidden" required />
                        </label>
                    </div>
                </div>

                <!-- Action button -->
                <button type="submit" id="submit-btn" class="w-full text-white bg-blue-600 hover:bg-blue-700 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-3 text-center transition-colors">
                    开始转换
                </button>
            </form>
        </div>

        <!-- Progress and Logs Box (Hidden initially) -->
        <div id="status-box" class="bg-white rounded-xl shadow-lg w-full max-w-2xl p-8 hidden">
            <h2 class="text-xl font-bold mb-4 text-gray-700">处理进度</h2>
            
            <!-- Progress Bar -->
            <div class="w-full bg-gray-200 rounded-full h-4 mb-2">
                <div id="progress-bar" class="bg-blue-600 h-4 rounded-full transition-all duration-300" style="width: 0%"></div>
            </div>
            <p id="progress-text" class="text-right text-sm text-gray-600 mb-4 animate-pulse">正在准备上传...</p>

            <!-- Logs -->
            <div class="bg-gray-900 rounded-lg p-4 text-green-400 text-sm log-container" id="log-container">
            </div>

            <!-- Download Action (Hidden until done) -->
            <div id="result-actions" class="mt-6 flex justify-center hidden">
                <a id="download-link" href="#" class="px-6 py-2 bg-green-500 text-white rounded-lg hover:bg-green-600 font-semibold flex items-center shadow">
                    <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                    下载转换结果
                </a>
                <a id="log-link" href="#" class="ml-4 px-6 py-2 bg-gray-500 text-white rounded-lg hover:bg-gray-600 font-semibold flex items-center shadow">
                    <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                    下载日志
                </a>
                <button id="reset-btn" class="ml-4 px-6 py-2 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300 font-semibold shadow">
                    返回重试
                </button>
            </div>
        </div>
    </main>

    <footer class="text-center text-sm text-gray-500 pb-8">
        服务端提供后端限制 (限流: 3次/分钟)。请妥善保管下载链接，生成的文件将在 10 分钟后自动销毁。
    </footer>

    <script>
        const form = document.getElementById('convert-form');
        const submitBtn = document.getElementById('submit-btn');
        const templateInput = document.getElementById('template');
        const contentInput = document.getElementById('content');
        
        const statusBox = document.getElementById('status-box');
        const progressBar = document.getElementById('progress-bar');
        const progressText = document.getElementById('progress-text');
        const logContainer = document.getElementById('log-container');
        const resultActions = document.getElementById('result-actions');
        const downloadLink = document.getElementById('download-link');
        const logLink = document.getElementById('log-link');
        const resetBtn = document.getElementById('reset-btn');

        // Allow selection naming
        function handleFileDisplay(inputId, displayId) {
            document.getElementById(inputId).addEventListener('change', function(e) {
                if(e.target.files.length > 0) {
                    document.getElementById(displayId).textContent = '已选择: ' + e.target.files[0].name;
                    document.getElementById(displayId).classList.add('text-blue-500', 'font-medium');
                }
            });
        }
        handleFileDisplay('template', 'template-name');
        handleFileDisplay('content', 'content-name');

        function appendLog(msg, type='info') {
            const time = new Date().toLocaleTimeString();
            const elm = document.createElement('div');
            elm.textContent = `[${time}] ${msg}`;
            if(type === 'error') elm.classList.add('text-red-400');
            if(type === 'warn') elm.classList.add('text-yellow-400');
            logContainer.appendChild(elm);
            logContainer.scrollTop = logContainer.scrollHeight;
        }

        function setProgress(percent, label) {
            progressBar.style.width = percent + '%';
            if(label) progressText.textContent = label;
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const templateFile = templateInput.files[0];
            const contentFile = contentInput.files[0];

            if (!templateFile || !contentFile) {
                alert('请先选择两个需要处理的文件。');
                return;
            }

            // UI Adjustments
            statusBox.classList.remove('hidden');
            resultActions.classList.add('hidden');
            downloadLink.classList.remove('hidden');
            logLink.classList.add('hidden');
            submitBtn.disabled = true;
            submitBtn.classList.add('opacity-50', 'cursor-not-allowed');
            logContainer.innerHTML = '';

            appendLog('开始处理任务，准备进行网络请求...');
            setProgress(10, '正在打包文件...');

            // Prepare formData
            const formData = new FormData();
            formData.append('template', templateFile);
            formData.append('content', contentFile);

            const stepLabels = {
                'workflow': '工作流启动',
                'analyze_template': '模板分析',
                'analyze_content': '内容分析',
                'generate_document': '文档生成',
                'generate_chunk': '生成分块',
                'write_docx': '写入 DOCX',
            };

            const stepProgress = {
                'workflow': 15,
                'analyze_template': 30,
                'analyze_content': 30,
                'generate_document': 50,
                'write_docx': 85,
                'done': 100,
            };

            let lastLogUrl = null;

            try {
                setProgress(20, '正在上传到服务器...');
                appendLog(`上传模板: ${templateFile.name} (${(templateFile.size/1024).toFixed(2)} KB)`);
                appendLog(`上传内容: ${contentFile.name} (${(contentFile.size/1024).toFixed(2)} KB)`);

                const response = await fetch('/api/convert', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok && response.headers.get('content-type')?.includes('application/json')) {
                    const errJson = await response.json().catch(() => ({}));
                    const errMsg = errJson.detail || response.statusText;
                    throw new Error(`服务器返回错误: ${response.status} - ${errMsg}`);
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop();

                    for (const line of lines) {
                        if (!line.startsWith('data: ')) continue;
                        let data;
                        try { data = JSON.parse(line.slice(6)); } catch { continue; }

                        if (data.log_url) lastLogUrl = data.log_url;

                        if (data.step === 'init') {
                            logLink.href = data.log_url;
                            continue;
                        }

                        if (data.step === 'error') {
                            if (lastLogUrl) {
                                logLink.href = lastLogUrl;
                                logLink.classList.remove('hidden');
                            }
                            throw new Error(data.detail || '转换过程中发生错误');
                        }

                        if (data.step === 'done') {
                            setProgress(100, '转换成功！');
                            progressText.classList.remove('animate-pulse');
                            progressText.classList.add('text-green-600', 'font-bold');
                            appendLog(`转换完成: File ID = ${data.file_id}`);
                            downloadLink.href = data.download_url;
                            if (data.log_url) {
                                logLink.href = data.log_url;
                                logLink.classList.remove('hidden');
                            }
                            resultActions.classList.remove('hidden');
                            continue;
                        }

                        const label = stepLabels[data.step] || data.step;
                        if (data.step === 'generate_chunk') {
                            const chunkPct = 50 + Math.round((data.current / data.total) * 30);
                            setProgress(chunkPct, `文档生成中 (${data.current}/${data.total})...`);
                            appendLog(`${label}: ${data.current}/${data.total}`);
                        } else if (data.status === 'started') {
                            const pct = stepProgress[data.step] || 25;
                            setProgress(pct, `${label} 进行中...`);
                            appendLog(`${label} 开始`);
                        } else if (data.status === 'completed') {
                            appendLog(`${label} 完成 (${data.elapsed}s)`);
                            const pct = (stepProgress[data.step] || 25) + 10;
                            setProgress(Math.min(pct, 90), `${label} 完成`);
                        }
                    }
                }

            } catch (error) {
                setProgress(0, '处理失败');
                progressText.classList.remove('animate-pulse');
                progressText.classList.add('text-red-500');
                appendLog(error.message, 'error');

                downloadLink.classList.add('hidden');
                if (lastLogUrl) {
                    logLink.href = lastLogUrl;
                    logLink.classList.remove('hidden');
                }
                resultActions.classList.remove('hidden');
            } finally {
                submitBtn.disabled = false;
                submitBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            }
        });

        resetBtn.addEventListener('click', () => {
            // Restore initial state
            statusBox.classList.add('hidden');
            form.reset();
            document.getElementById('template-name').textContent = '支持 .docx 格式，最大 10MB';
            document.getElementById('template-name').classList.remove('text-blue-500', 'font-medium');
            document.getElementById('content-name').textContent = '支持 .docx 格式，最大 10MB';
            document.getElementById('content-name').classList.remove('text-blue-500', 'font-medium');

            setProgress(0, '正在准备上传...');
            progressText.classList.add('animate-pulse');
            progressText.classList.remove('text-green-600', 'text-red-500', 'font-bold');
            downloadLink.classList.remove('hidden');
            logLink.classList.add('hidden');
            logLink.href = '#';
        });
    </script>
</body>
</html>
