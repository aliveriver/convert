<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>格式互转</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .format-btn {
            transition: all 0.2s;
        }
        .format-btn.active {
            ring: 2px;
            transform: scale(1.05);
        }
        .format-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            transform: none;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800">
    <nav class="bg-white shadow-md py-4">
        <div class="container mx-auto px-6 flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold text-blue-600">格式互转</h1>
                <p class="text-sm text-gray-500">Word / Markdown / LaTeX 三种格式互相转换</p>
            </div>
            <div class="flex items-center space-x-4">
                <a href="/frontend/index.html" class="text-blue-500 hover:underline text-sm font-medium">← 模板转换</a>
                <a href="/frontend/compare.html" class="text-blue-500 hover:underline text-sm font-medium">文档对比</a>
                <a href="https://github.com/aliveriver/convert" target="_blank" class="text-gray-500 hover:text-gray-900 transition-colors" title="View Source on GitHub">
                    <svg class="h-6 w-6" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                        <path fill-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z" clip-rule="evenodd"></path>
                    </svg>
                </a>
            </div>
        </div>
    </nav>

    <main class="container mx-auto px-6 py-8 flex flex-col items-center">
        <!-- Upload Section -->
        <div class="bg-white rounded-xl shadow-lg w-full max-w-2xl p-8 mb-8" id="upload-section">
            <h2 class="text-xl font-bold mb-6 text-gray-700 border-b pb-2">上传文件</h2>

            <form id="convert-form" class="space-y-6">
                <!-- File Upload -->
                <div>
                    <label for="file-input" class="flex flex-col items-center justify-center w-full h-36 border-2 border-dashed rounded-lg cursor-pointer bg-gray-50 hover:bg-gray-100 hover:border-blue-400 border-gray-300">
                        <div class="flex flex-col items-center justify-center pt-5 pb-6">
                            <svg class="w-8 h-8 mb-3 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
                            </svg>
                            <p class="mb-2 text-sm text-gray-500"><span class="font-semibold">点击上传</span> 或拖拽文件到此处</p>
                            <p class="text-xs text-gray-400" id="file-name">支持 .docx .md .tex 格式</p>
                        </div>
                        <input id="file-input" type="file" accept=".docx,.md,.markdown,.tex,.latex" class="hidden" required />
                    </label>
                </div>

                <!-- Target Format -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-3">目标格式</label>
                    <div class="flex gap-4" id="format-buttons">
                        <button type="button" data-format="docx" class="format-btn flex-1 py-3 px-4 rounded-lg border-2 border-gray-200 bg-white hover:border-blue-400 hover:bg-blue-50 font-medium text-gray-700 focus:outline-none">
                            <div class="text-lg">Word</div>
                            <div class="text-xs text-gray-400">.docx</div>
                        </button>
                        <button type="button" data-format="md" class="format-btn flex-1 py-3 px-4 rounded-lg border-2 border-gray-200 bg-white hover:border-blue-400 hover:bg-blue-50 font-medium text-gray-700 focus:outline-none">
                            <div class="text-lg">Markdown</div>
                            <div class="text-xs text-gray-400">.md</div>
                        </button>
                        <button type="button" data-format="tex" class="format-btn flex-1 py-3 px-4 rounded-lg border-2 border-gray-200 bg-white hover:border-blue-400 hover:bg-blue-50 font-medium text-gray-700 focus:outline-none">
                            <div class="text-lg">LaTeX</div>
                            <div class="text-xs text-gray-400">.tex</div>
                        </button>
                    </div>
                </div>

                <!-- Submit -->
                <button type="submit" id="submit-btn" disabled class="w-full py-3 bg-blue-600 text-white font-semibold rounded-lg hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed transition-colors">
                    开始转换
                </button>

                <!-- Loading -->
                <div id="loading" class="hidden text-center py-4">
                    <div class="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600"></div>
                    <p class="mt-2 text-sm text-gray-500">转换中...</p>
                </div>

                <!-- Error -->
                <p id="error-msg" class="hidden text-red-500 text-sm text-center"></p>
            </form>
        </div>

        <!-- Result Section -->
        <div class="bg-white rounded-xl shadow-lg w-full max-w-2xl p-8 hidden" id="result-section">
            <div class="text-center">
                <svg class="w-16 h-16 mx-auto text-green-500 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
                <h3 class="text-xl font-bold text-gray-700 mb-2">转换完成</h3>
                <p class="text-sm text-gray-500 mb-6" id="result-filename"></p>
                <div class="flex gap-4 justify-center">
                    <a id="download-link" href="#" class="inline-block py-3 px-6 bg-blue-600 text-white font-semibold rounded-lg hover:bg-blue-700 transition-colors">下载文件</a>
                    <button id="reset-btn" class="py-3 px-6 border-2 border-gray-300 text-gray-700 font-semibold rounded-lg hover:border-blue-400 hover:text-blue-600 transition-colors">继续转换</button>
                </div>
            </div>
        </div>
    </main>

    <!-- PLACEHOLDER_SCRIPT -->
    <script>
        const fileInput = document.getElementById('file-input');
        const fileName = document.getElementById('file-name');
        const formatBtns = document.querySelectorAll('.format-btn');
        const submitBtn = document.getElementById('submit-btn');
        const form = document.getElementById('convert-form');
        const loading = document.getElementById('loading');
        const errorMsg = document.getElementById('error-msg');
        const uploadSection = document.getElementById('upload-section');
        const resultSection = document.getElementById('result-section');
        const resultFilename = document.getElementById('result-filename');
        const downloadLink = document.getElementById('download-link');

        let selectedFormat = null;
        let inputExt = null;

        const extToGroup = {
            '.docx': 'docx',
            '.md': 'md', '.markdown': 'md',
            '.tex': 'tex', '.latex': 'tex',
        };

        fileInput.addEventListener('change', () => {
            const file = fileInput.files[0];
            if (!file) return;
            fileName.textContent = file.name;
            fileName.classList.add('text-blue-500', 'font-medium');

            const dot = file.name.lastIndexOf('.');
            inputExt = dot >= 0 ? file.name.slice(dot).toLowerCase() : '';
            const inputGroup = extToGroup[inputExt];

            formatBtns.forEach(btn => {
                const fmt = btn.dataset.format;
                if (fmt === inputGroup) {
                    btn.disabled = true;
                    btn.classList.remove('border-blue-500', 'bg-blue-50', 'text-blue-700');
                    if (selectedFormat === fmt) {
                        selectedFormat = null;
                    }
                } else {
                    btn.disabled = false;
                }
            });
            updateSubmitState();
        });

        formatBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                if (btn.disabled) return;
                formatBtns.forEach(b => b.classList.remove('border-blue-500', 'bg-blue-50', 'text-blue-700'));
                btn.classList.add('border-blue-500', 'bg-blue-50', 'text-blue-700');
                selectedFormat = btn.dataset.format;
                updateSubmitState();
            });
        });

        function updateSubmitState() {
            submitBtn.disabled = !(fileInput.files.length > 0 && selectedFormat);
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMsg.classList.add('hidden');
            loading.classList.remove('hidden');
            submitBtn.disabled = true;

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);
            formData.append('target_format', selectedFormat);

            try {
                const res = await fetch('/api/format-convert', {
                    method: 'POST',
                    body: formData,
                });

                if (!res.ok) {
                    const err = await res.json().catch(() => ({}));
                    throw new Error(err.detail || '转换失败，请检查服务');
                }

                const data = await res.json();
                resultFilename.textContent = data.filename;
                downloadLink.href = data.download_url;

                uploadSection.classList.add('hidden');
                resultSection.classList.remove('hidden');
            } catch (error) {
                errorMsg.textContent = error.message;
                errorMsg.classList.remove('hidden');
            } finally {
                loading.classList.add('hidden');
                submitBtn.disabled = false;
            }
        });

        document.getElementById('reset-btn').addEventListener('click', () => {
            uploadSection.classList.remove('hidden');
            resultSection.classList.add('hidden');
            form.reset();
            fileName.textContent = '支持 .docx .md .tex 格式';
            fileName.classList.remove('text-blue-500', 'font-medium');
            formatBtns.forEach(btn => {
                btn.disabled = false;
                btn.classList.remove('border-blue-500', 'bg-blue-50', 'text-blue-700');
            });
            selectedFormat = null;
            inputExt = null;
            updateSubmitState();
        });
    </script>
</body>
</html>
