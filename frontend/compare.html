<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word 文档对比</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .diff-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
        }
        .diff-block {
            padding: 0.75rem;
            border-radius: 0.5rem;
            margin-bottom: 0.5rem;
            white-space: pre-wrap;
            line-height: 1.6;
            border: 1px solid #e5e7eb;
        }

        .diff-block mark {
            background: #fde68a;
            text-decoration: underline;
            text-decoration-color: #d97706;
            border-radius: 2px;
            padding: 0 1px;
        }
        
        .format-diff {
            background-color: #fef2f2;
            border-color: #fca5a5;
        }
        
        .content-diff {
            background-color: #fefce8;
            border-color: #fde047;
        }

        .both-diff {
            background: linear-gradient(135deg, #fef2f2 50%, #fefce8 50%);
            border-color: #f87171;
            border-width: 2px;
        }
        
        .equal-diff {
            background-color: #f9fafb;
            color: #374151;
        }
        
        .format-badge {
            display: block;
            font-size: 0.75rem;
            color: #ef4444;
            margin-top: 0.5rem;
            font-weight: 600;
        }
        
        .diff-header {
            font-weight: bold;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid #e5e7eb;
            margin-bottom: 1rem;
            text-align: center;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800">
    <nav class="bg-white shadow-md py-4">
        <div class="container mx-auto px-6 flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold text-blue-600">Word 文档智能对比</h1>
                <p class="text-sm text-gray-500">上传两份文档，高亮对比差异</p>
            </div>
            <div class="flex items-center space-x-4">
                <a href="/frontend/index.html" class="text-blue-500 hover:underline text-sm font-medium">← 返回转换工具</a>
                <a href="https://github.com/aliveriver/convert" target="_blank" class="text-gray-500 hover:text-gray-900 transition-colors" title="View Source on GitHub">
                    <svg class="h-6 w-6" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                        <path fill-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z" clip-rule="evenodd"></path>
                    </svg>
                </a>
            </div>
        </div>
    </nav>

    <main class="container mx-auto px-6 py-8 flex flex-col items-center">
        <!-- Upload Form -->
        <div class="bg-white rounded-xl shadow-lg w-full max-w-4xl p-8 mb-8" id="upload-section">
            <h2 class="text-xl font-bold mb-6 text-gray-700 border-b pb-2">提交对比文档</h2>
            
            <form id="compare-form" class="space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <!-- Doc1 -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">原始文档 (.docx)</label>
                        <label for="doc1" class="flex flex-col items-center justify-center w-full h-32 border-2 border-dashed rounded-lg cursor-pointer bg-gray-50 hover:bg-gray-100 hover:border-blue-400 border-gray-300">
                            <div class="flex flex-col items-center justify-center pt-5 pb-6">
                                <p class="mb-2 text-sm text-gray-500"><span class="font-semibold">点击上传</span></p>
                                <p class="text-xs text-center text-gray-500 px-2 name-display" id="doc1-name">原文档 / 基准文档</p>
                            </div>
                            <input id="doc1" type="file" accept=".docx" class="hidden" required />
                        </label>
                    </div>

                    <!-- Doc2 -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">修改文档 (.docx)</label>
                        <label for="doc2" class="flex flex-col items-center justify-center w-full h-32 border-2 border-dashed rounded-lg cursor-pointer bg-gray-50 hover:bg-gray-100 hover:border-blue-400 border-gray-300">
                            <div class="flex flex-col items-center justify-center pt-5 pb-6">
                                <p class="mb-2 text-sm text-gray-500"><span class="font-semibold">点击上传</span></p>
                                <p class="text-xs text-center text-gray-500 px-2 name-display" id="doc2-name">目标文档 / 差异文档</p>
                            </div>
                            <input id="doc2" type="file" accept=".docx" class="hidden" required />
                        </label>
                    </div>
                </div>

                <div class="flex items-center justify-between">
                    <div class="flex space-x-4 text-sm text-gray-600">
                        <span class="flex items-center"><span class="w-3 h-3 bg-red-100 border border-red-300 inline-block mr-1 rounded"></span> 标红: 格式差异</span>
                        <span class="flex items-center"><span class="w-3 h-3 bg-yellow-100 border border-yellow-300 inline-block mr-1 rounded"></span> 标黄: 内容差异</span>
                        <span class="flex items-center"><span class="w-3 h-3 inline-block mr-1 rounded" style="background: linear-gradient(135deg, #fef2f2 50%, #fefce8 50%); border: 1px solid #f87171;"></span> 红黄: 两者皆有</span>
                    </div>
                    <button type="submit" id="submit-btn" class="text-white bg-blue-600 hover:bg-blue-700 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm px-8 py-2.5 text-center transition-colors">
                        开始对比
                    </button>
                </div>
                
                <div id="error-msg" class="text-red-500 text-sm hidden font-medium mt-2"></div>
            </form>
        </div>

        <!-- Loading Indicator -->
        <div id="loading" class="hidden my-12 flex flex-col items-center justify-center">
            <svg class="animate-spin h-10 w-10 text-blue-600 mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <p class="text-gray-600 text-sm font-medium">正在解析段落和格式...</p>
        </div>

        <!-- Result Container -->
        <div id="result-section" class="bg-white rounded-xl shadow-lg w-full max-w-6xl p-8 hidden">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-bold text-gray-700">对比结果</h2>
                <div class="flex items-center space-x-2">
                    <span class="text-sm text-gray-500 mr-2">筛选:</span>
                    <button data-filter="all" class="filter-btn px-3 py-1 text-xs font-medium rounded-full bg-blue-600 text-white">全部</button>
                    <button data-filter="format" class="filter-btn px-3 py-1 text-xs font-medium rounded-full bg-gray-200 text-gray-700 hover:bg-gray-300">仅格式</button>
                    <button data-filter="content" class="filter-btn px-3 py-1 text-xs font-medium rounded-full bg-gray-200 text-gray-700 hover:bg-gray-300">仅内容</button>
                    <button id="reset-btn" class="ml-4 px-4 py-1 bg-gray-200 text-gray-700 rounded hover:bg-gray-300 text-sm font-semibold">重新上传</button>
                </div>
            </div>
            
            <div class="diff-container" id="diff-grid">
                <div class="diff-header text-gray-600 text-lg">原始文档</div>
                <div class="diff-header text-gray-600 text-lg">修改文档</div>
                <!-- Dynamic Content Here -->
            </div>
        </div>
    </main>

    <script>
        const form = document.getElementById('compare-form');
        const doc1Input = document.getElementById('doc1');
        const doc2Input = document.getElementById('doc2');
        const uploadSection = document.getElementById('upload-section');
        const resultSection = document.getElementById('result-section');
        const loading = document.getElementById('loading');
        const diffGrid = document.getElementById('diff-grid');
        const errorMsg = document.getElementById('error-msg');
        const submitBtn = document.getElementById('submit-btn');

        function handleFileDisplay(inputId, displayId) {
            document.getElementById(inputId).addEventListener('change', function(e) {
                if(e.target.files.length > 0) {
                    document.getElementById(displayId).textContent = e.target.files[0].name;
                    document.getElementById(displayId).classList.add('text-blue-500', 'font-medium');
                }
            });
        }
        handleFileDisplay('doc1', 'doc1-name');
        handleFileDisplay('doc2', 'doc2-name');

        function applyFormatStyle(el, fmt) {
            if (!fmt) return;
            if (fmt.font_name) el.style.fontFamily = `"${fmt.font_name}", serif`;
            if (fmt.font_size_pt) {
                el.style.fontSize = fmt.font_size_pt + 'pt';
            } else {
                el.style.fontSize = '12pt';
            }
            if (fmt.bold) el.style.fontWeight = 'bold';
            if (fmt.italic) el.style.fontStyle = 'italic';
            if (fmt.alignment) el.style.textAlign = fmt.alignment;
            if (fmt.space_before_pt) el.style.marginTop = fmt.space_before_pt + 'pt';
            if (fmt.space_after_pt) el.style.marginBottom = fmt.space_after_pt + 'pt';
            if (fmt.first_line_indent_pt) el.style.textIndent = fmt.first_line_indent_pt + 'pt';
            if (fmt.line_spacing) {
                const ls = String(fmt.line_spacing);
                if (ls.endsWith('pt')) {
                    el.style.lineHeight = ls;
                } else {
                    el.style.lineHeight = fmt.line_spacing;
                }
            }
        }

        function appendBlock(item) {
            const typeClass = item.type === 'equal' ? 'equal-diff'
                            : item.type === 'format_diff' ? 'format-diff'
                            : item.type === 'both_diff' ? 'both-diff'
                            : 'content-diff';

            const block1 = document.createElement('div');
            block1.className = `diff-block ${typeClass}`;
            block1.dataset.diffType = item.type;
            applyFormatStyle(block1, item.format1);

            const block2 = document.createElement('div');
            block2.className = `diff-block ${typeClass}`;
            block2.dataset.diffType = item.type;
            applyFormatStyle(block2, item.format2);

            if ((item.type === 'content_diff' || item.type === 'both_diff') && item.html1 !== undefined) {
                block1.innerHTML = item.html1 || '<em style="color:#9ca3af">(空白 / 缺少内容)</em>';
                block2.innerHTML = item.html2 || '<em style="color:#9ca3af">(空白 / 缺少内容)</em>';
            } else {
                block1.textContent = item.text1 || '(空白 / 缺少内容)';
                block2.textContent = item.text2 || '(空白 / 缺少内容)';
            }

            if (item.format_changes && item.format_changes.length > 0) {
                const badge = document.createElement('span');
                badge.className = 'format-badge';
                const parts = item.format_changes.map(c => `${c.label}: ${c.from ?? '无'} → ${c.to ?? '无'}`);
                badge.textContent = parts.join('；');
                block2.appendChild(badge);
            }

            diffGrid.appendChild(block1);
            diffGrid.appendChild(block2);
        }

        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.filter-btn').forEach(b => {
                    b.classList.remove('bg-blue-600', 'text-white');
                    b.classList.add('bg-gray-200', 'text-gray-700');
                });
                this.classList.remove('bg-gray-200', 'text-gray-700');
                this.classList.add('bg-blue-600', 'text-white');

                const filter = this.dataset.filter;
                const blocks = diffGrid.querySelectorAll('.diff-block');
                for (let i = 0; i < blocks.length; i += 2) {
                    const b1 = blocks[i];
                    const b2 = blocks[i + 1];
                    const type = b1.dataset.diffType;
                    let show = true;
                    if (filter === 'format') {
                        show = (type === 'format_diff' || type === 'both_diff');
                    } else if (filter === 'content') {
                        show = (type === 'content_diff' || type === 'both_diff');
                    }
                    b1.style.display = show ? '' : 'none';
                    b2.style.display = show ? '' : 'none';
                }
            });
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMsg.classList.add('hidden');
            
            if (!doc1Input.files[0] || !doc2Input.files[0]) {
                return;
            }

            uploadSection.classList.add('opacity-50', 'pointer-events-none');
            submitBtn.disabled = true;
            loading.classList.remove('hidden');

            const formData = new FormData();
            formData.append('doc1', doc1Input.files[0]);
            formData.append('doc2', doc2Input.files[0]);

            try {
                const res = await fetch('/api/compare', {
                    method: 'POST',
                    body: formData
                });

                if (!res.ok) {
                    const err = await res.json().catch(() => ({}));
                    throw new Error(err.detail || '请求失败，请检查服务');
                }

                const data = await res.json();
                
                // Clear grid except headers
                while (diffGrid.children.length > 2) {
                    diffGrid.removeChild(diffGrid.lastChild);
                }

                data.comparison.forEach(item => {
                    appendBlock(item);
                });

                uploadSection.classList.add('hidden');
                resultSection.classList.remove('hidden');

            } catch (error) {
                errorMsg.textContent = error.message;
                errorMsg.classList.remove('hidden');
            } finally {
                uploadSection.classList.remove('opacity-50', 'pointer-events-none');
                submitBtn.disabled = false;
                loading.classList.add('hidden');
            }
        });

        document.getElementById('reset-btn').addEventListener('click', () => {
            uploadSection.classList.remove('hidden');
            resultSection.classList.add('hidden');
            form.reset();
            document.getElementById('doc1-name').textContent = '原文档 / 基准文档';
            document.getElementById('doc2-name').textContent = '目标文档 / 差异文档';
            document.getElementById('doc1-name').classList.remove('text-blue-500', 'font-medium');
            document.getElementById('doc2-name').classList.remove('text-blue-500', 'font-medium');
        });
    </script>
</body>
</html>
